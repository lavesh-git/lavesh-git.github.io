name: Build and deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Configure library path
        env:
          LIBRARY_PATH: ${{ secrets.LIBRARY_PATH }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          path = os.environ.get('LIBRARY_PATH', '')
          if not re.fullmatch(r'/library-[a-f0-9]{24}/', path):
              raise SystemExit('LIBRARY_PATH is missing or has an invalid format')
          for name in ('_config.yml', 'library.html'):
              file = Path(name)
              content = file.read_text()
              if '/library-preview/' not in content:
                  raise SystemExit('Library preview placeholder is missing')
              file.write_text(content.replace('/library-preview/', path))
          PYCODE
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/excalidraw/package-lock.json
      - name: Export Excalidraw diagrams
        run: |
          npm ci --prefix scripts/excalidraw
          node scripts/excalidraw/export.cjs
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
