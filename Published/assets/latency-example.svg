<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Why cache reads?</title><desc id="desc">Illustrative comparison: a cache hit is 2 milliseconds; a database read is 40 milliseconds. These are hypothetical numbers.</desc><rect width="1000" height="430" rx="20" fill="#f5f7fc"/><g font-family="Arial,sans-serif"><text x="48" y="63" fill="#172033" font-size="29" font-weight="700">A small shortcut for frequent reads</text><text x="48" y="99" fill="#64748b" font-size="17">ILLUSTRATIVE LATENCY · LOWER IS BETTER</text><text x="48" y="174" fill="#334155" font-size="21">Cache hit</text><rect x="245" y="145" width="30" height="48" rx="8" fill="#10b981"/><text x="290" y="176" fill="#047857" font-size="23" font-weight="700">2 ms</text><text x="48" y="259" fill="#334155" font-size="21">Database read</text><rect x="245" y="230" width="600" height="48" rx="8" fill="#818cf8"/><text x="865" y="261" fill="#4338ca" font-size="23" font-weight="700">40 ms</text><path d="M245 307H920" stroke="#cbd5e1"/><text x="48" y="365" fill="#64748b" font-size="17">Made-up values for learning — actual performance depends on your system.</text></g></svg>