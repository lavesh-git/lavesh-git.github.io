<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title }} · {{ site.title }}</title>
<style>
:root{color-scheme:dark;--bg:#11151c;--panel:#191f29;--line:#303948;--text:#e9edf4;--muted:#a1adbf;--accent:#a5b4fc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--accent);text-underline-offset:4px}header{max-width:980px;margin:auto;padding:26px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:24px;font-size:14px}header a{text-decoration:none}main{max-width:860px;margin:auto;padding:60px 32px 90px}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:12px;color:var(--accent);font-weight:700}h1{font-size:clamp(32px,5vw,48px);line-height:1.15;letter-spacing:-.035em;margin:16px 0}h2{font-size:25px;margin-top:48px;letter-spacing:-.02em}h3{font-size:20px}p,li{color:#c5cedc}.subtitle{color:var(--muted);font-size:19px;margin-bottom:32px}img{max-width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);background:#fff;margin:24px 0}blockquote{margin:24px 0;padding:14px 22px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 10px 10px 0}blockquote p{margin:0}pre{overflow:auto;background:#0c1017;padding:24px;border:1px solid var(--line);border-radius:12px;font-size:14px;line-height:1.7}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}p code,li code{background:var(--panel);padding:3px 6px;border-radius:4px;font-size:.87em}.k,.kd,.kn{color:#c4b5fd}.s,.s1,.s2{color:#a7f3d0}.c,.c1,.cm{color:#94a3b8}.mi,.mf{color:#fcd34d}.nf,.nb{color:#93c5fd}table{border-collapse:collapse;width:100%;font-size:15px}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--muted)}footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.card{display:block;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;text-decoration:none;margin:30px 0}.card strong{font-size:21px;color:var(--text)}.card p{margin-bottom:0}hr{border:0;border-top:1px solid var(--line);margin:36px 0}@media(max-width:600px){main{padding:36px 20px}header{padding:20px}pre{padding:16px}}
</style></head><body><header><a href="/">LAVESH / NOTES</a><a href="https://github.com/lavesh-git/lavesh-git.github.io">View source ↗</a></header><main><div class="eyebrow">{{ page.category | default: "Learning notebook" }}</div><h1>{{ page.title }}</h1>{% if page.description %}<p class="subtitle">{{ page.description }}</p>{% endif %}{{ content }}<footer>Written in Obsidian · Published with GitHub Pages</footer></main></body></html>
